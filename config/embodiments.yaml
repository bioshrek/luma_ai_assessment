# What each channel of each embodiment actually means.
#
# Upstream field names are not evidence. pusht ships its two channels as `motor_0` / `motor_1`
# under a `motors` key; they are neither motors nor joints — they are the x and y of a planar
# end effector, in PIXELS of a 512x512 simulator canvas. The truth is asserted here, and the
# adapter maps upstream columns onto these channels positionally after asserting the width.

version: 1

embodiments:
  pusht_planar:
    description: >-
      PushT: a 2D planar pusher in a 512x512 pixel simulator canvas. Not an arm, no gripper,
      no joints. Action is the absolute target position of the pusher tip.
    is_real_robot: false
    is_teleop: true # human demonstrations collected through a pointer device

    action:
      level: per_frame_continuous
      channels:
        - name: ee.x
          role: end_effector
          space: cartesian_2d
          origin: measured
          is_delta: false # absolute target position, not a displacement
          is_physical: true
          unit: px # NOT metres: there is no published pixel-to-metre scale
          metric_convertible: false
          frame: world
          group: ee_xy
          min: 0.0
          max: 512.0
        - name: ee.y
          role: end_effector
          space: cartesian_2d
          origin: measured
          is_delta: false
          is_physical: true
          unit: px
          metric_convertible: false
          frame: world
          group: ee_xy
          min: 0.0
          max: 512.0

    state:
      level: per_frame_continuous
      channels:
        - name: ee.x
          role: end_effector
          space: cartesian_2d
          origin: measured
          is_delta: false
          is_physical: true
          unit: px
          metric_convertible: false
          frame: world
          group: ee_xy
          min: 0.0
          max: 512.0
        - name: ee.y
          role: end_effector
          space: cartesian_2d
          origin: measured
          is_delta: false
          is_physical: true
          unit: px
          metric_convertible: false
          frame: world
          group: ee_xy
          min: 0.0
          max: 512.0

  # ------------------------------------------------------------------------------------
  # B — ALOHA bimanual. One 14-D vector carrying TWO units: 12 joints in radians and
  # 2 normalized gripper openings. That is the fact that forces `unit` and `gripper` to be
  # per-channel rather than per-spec (ADR 008). `arm_id` is mandatory here: without it a
  # dual-arm vector cannot be split, or aligned with a single-arm embodiment.
  # ------------------------------------------------------------------------------------
  aloha_bimanual:
    description: >-
      ALOHA simulated bimanual insertion, 2 x (6 joints + 1 gripper) = 14. Action is the
      leader-arm target pose (a command); state is the follower-arm measured pose.
    is_real_robot: false
    is_teleop: true # human teleoperation through the ALOHA leader arms

    # Action and state are the SAME channel layout — target vs measured. `is_command` is the
    # only thing distinguishing them, and it is what defends STATE_ACTION_ECHO in M5.
    action: &aloha_channels
      level: per_frame_continuous
      channels:
        - {
            name: left.waist,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        - {
            name: left.shoulder,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        - {
            name: left.elbow,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        - {
            name: left.forearm_roll,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        - {
            name: left.wrist_angle,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        - {
            name: left.wrist_rotate,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: left,
            group: left_arm,
          }
        # Position 6 of the same vector is neither a joint angle nor in radians.
        - name: left.gripper
          role: gripper
          space: gripper
          origin: measured
          is_delta: false # an absolute opening, unlike source C's ternary change command
          is_physical: true
          unit: normalized
          metric_convertible: false # no published jaw-width scale
          arm_id: left
          gripper: &aloha_gripper
            # Values are stored exactly as upstream emitted them, so our convention IS the
            # original one and the inverse is the identity. The open/closed DIRECTION is not
            # stated by the dataset and is not guessed here — see ADR 008.
            convention: normalized_unverified_direction
            original_convention: normalized_unverified_direction
            inverse: { scale: 1.0, offset: 0.0 }
        - {
            name: right.waist,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - {
            name: right.shoulder,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - {
            name: right.elbow,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - {
            name: right.forearm_roll,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - {
            name: right.wrist_angle,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - {
            name: right.wrist_rotate,
            role: joint,
            space: joint_position,
            origin: measured,
            is_delta: false,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            arm_id: right,
            group: right_arm,
          }
        - name: right.gripper
          role: gripper
          space: gripper
          origin: measured
          is_delta: false
          is_physical: true
          unit: normalized
          metric_convertible: false
          arm_id: right
          gripper: *aloha_gripper

    state: *aloha_channels

  # ------------------------------------------------------------------------------------
  # C — Berkeley UR5 (OXE / RLDS). The vector that disproves every spec-level shortcut:
  # 6 delta channels, 1 gripper CHANGE command, and 1 non-physical control flag, in three
  # different units, inside one 8-D action (ADR 003).
  # ------------------------------------------------------------------------------------
  ur5_single_arm:
    description: >-
      UR5 single arm, teleoperated. Action is an end-effector delta pose plus a ternary
      gripper change command plus a policy termination flag. State is a 15-D vector whose
      element semantics are published nowhere.
    is_real_robot: true
    is_teleop: true

    action:
      level: per_frame_continuous
      channels:
        - {
            name: ee.dx,
            role: end_effector,
            space: ee_translation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: m,
            metric_convertible: true,
            frame: base,
            group: ee_translation,
          }
        - {
            name: ee.dy,
            role: end_effector,
            space: ee_translation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: m,
            metric_convertible: true,
            frame: base,
            group: ee_translation,
          }
        - {
            name: ee.dz,
            role: end_effector,
            space: ee_translation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: m,
            metric_convertible: true,
            frame: base,
            group: ee_translation,
          }
        # features.json says "Delta change in roll, pitch, yaw" — so the axes are named but
        # the composition order is not. `unknown` rather than a plausible guess.
        - {
            name: ee.drx,
            role: end_effector,
            space: ee_rotation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            frame: base,
            group: ee_rotation,
            rotation: { repr: euler_rpy, compose: unknown },
          }
        - {
            name: ee.dry,
            role: end_effector,
            space: ee_rotation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            frame: base,
            group: ee_rotation,
            rotation: { repr: euler_rpy, compose: unknown },
          }
        - {
            name: ee.drz,
            role: end_effector,
            space: ee_rotation_delta,
            origin: measured,
            is_delta: true,
            is_physical: true,
            unit: rad,
            metric_convertible: true,
            frame: base,
            group: ee_rotation,
            rotation: { repr: euler_rpy, compose: unknown },
          }
        - name: gripper
          role: gripper
          space: gripper
          origin: measured
          # A ternary CHANGE command, not an opening: "1 if close, -1 if open, 0 if no
          # change". Normalizing it to B's absolute 0..1 convention would silently reinterpret
          # "no change" as "fully closed" (ADR 003 decision 2).
          is_delta: true
          is_physical: true
          unit: normalized
          metric_convertible: false
          min: -1.0
          max: 1.0
          gripper:
            convention: "-1=open,0=no_change,+1=close"
            original_convention: "-1=open,0=no_change,+1=close"
            inverse: { scale: 1.0, offset: 0.0 }
        # Position 7 is not a physical quantity at all. is_physical=false keeps it out of
        # every cross-channel statistic (FrameTable.physical_view, invariant 6).
        - {
            name: flag.terminate_episode,
            role: control_flag,
            space: flag,
            origin: measured,
            is_delta: false,
            is_physical: false,
            metric_convertible: false,
            min: 0.0,
            max: 1.0,
          }

    # features.json defers the meaning of these 15 numbers to an offsite web page. A wrong
    # role is worse than an honest absence, so every one of them is `unknown` and the vector
    # is preserved verbatim (ADR 003 decision 4).
    state:
      level: per_frame_continuous
      channels:
        - {
            name: robot_state_00,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_01,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_02,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_03,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_04,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_05,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_06,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_07,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_08,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_09,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_10,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_11,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_12,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_13,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }
        - {
            name: robot_state_14,
            role: unknown,
            space: unknown,
            origin: measured,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
          }

  # ------------------------------------------------------------------------------------
  # D — EPIC-KITCHENS-100 egocentric human. The embodiment that breaks the last three
  # spec-level assumptions the robot sources let us keep (ADR 010):
  #
  #   1. There is NO per-frame action. A human wearing a head camera emits no command; the
  #      only thing annotated is what they were doing, as one (verb, noun) label for the whole
  #      segment. `level: episode_label` with zero channels — not a zero vector, not an empty
  #      per-frame column. The label itself lives in `EpisodeMeta.task`, because it is one
  #      value per episode and a per-frame table is the wrong shape for it.
  #   2. The state channels are not MEASURED. They are a COLMAP reconstruction (EPIC-Fields),
  #      so `origin: estimated`, and a QC rule that would FAIL on them is downgraded to
  #      REVIEW by the engine (invariant 13).
  #   3. The IMU does not share the video clock. 195 Hz against a 50 fps video: it is a
  #      `streams` entry with `clock: own_timeline`, stored in its own parquet file, never a
  #      column of frames.parquet (invariant 17).
  #
  # Capabilities vary PER EPISODE inside this one embodiment: pose and IMU are separate
  # published layers with different video coverage. The embodiment declares what a channel
  # would mean; the adapter decides, per episode, whether it exists at all.
  # ------------------------------------------------------------------------------------
  human_ego:
    description: >-
      EPIC-KITCHENS-100 egocentric human, one head-mounted GoPro. No robot, no gripper, no
      joints, no commands. Action is a symbolic (verb, noun) label for the whole segment;
      "state" is the reconstructed pose of the camera, not of a body.
    is_real_robot: false # a human, not a robot — but the imagery is real, not simulated
    is_teleop: false # nobody is teleoperating anything; this is unmediated human behaviour

    action:
      level: episode_label
      # Deliberately empty. Invariant 3 forbids channels at a non-per-frame level: a channel
      # is a column, and there is no column to declare.
      channels: []

    state:
      level: per_frame_continuous
      channels:
        # Position of the camera in the reconstruction's own arbitrary world frame. The
        # reconstruction is scale-free (monocular SfM), so the numbers have NO unit and are
        # NOT convertible to metres. `unit: null` is the honest answer; "m" would be a lie
        # that survives every type check.
        - {
            name: cam_t.x,
            role: head,
            space: camera_translation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_t,
          }
        - {
            name: cam_t.y,
            role: head,
            space: camera_translation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_t,
          }
        - {
            name: cam_t.z,
            role: head,
            space: camera_translation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_t,
          }
        # A unit quaternion, stored in the upstream w,x,y,z order. `repr` is recorded because
        # a bare 4-vector is ambiguous — xyzw is just as common — and reading it wrong yields
        # a rotation that is plausible and wrong.
        - {
            name: cam_q.w,
            role: head,
            space: camera_rotation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_q,
            min: -1.0,
            max: 1.0,
            rotation: { repr: quat_wxyz },
          }
        - {
            name: cam_q.x,
            role: head,
            space: camera_rotation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_q,
            min: -1.0,
            max: 1.0,
            rotation: { repr: quat_wxyz },
          }
        - {
            name: cam_q.y,
            role: head,
            space: camera_rotation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_q,
            min: -1.0,
            max: 1.0,
            rotation: { repr: quat_wxyz },
          }
        - {
            name: cam_q.z,
            role: head,
            space: camera_rotation_abs,
            origin: estimated,
            is_delta: false,
            is_physical: true,
            metric_convertible: false,
            frame: world,
            group: cam_q,
            min: -1.0,
            max: 1.0,
            rotation: { repr: quat_wxyz },
          }

    # The IMU. Genuinely MEASURED — unlike the pose above — and genuinely metric: the units
    # were confirmed against the data in M0, not read off a field name (ADR 004). It samples
    # at ~195-198 Hz depending on the video, so it never enters the frame table.
    #
    # Gyroscope and accelerometer are TWO streams, not one six-column one: upstream ships two
    # files with two `Milliseconds` columns, and on P28_101 those columns disagree for 793 of
    # 141,924 samples (up to 15 ms apart). They are two sensors with two clocks; joining them
    # by row index would rotate accelerations onto the wrong instant (ADR 012).
    streams:
      gyro:
        channels:
          - {
              name: gyro.x,
              role: head,
              space: imu_angular_velocity,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: rad/s,
              metric_convertible: true,
              frame: sensor,
              group: gyro,
            }
          - {
              name: gyro.y,
              role: head,
              space: imu_angular_velocity,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: rad/s,
              metric_convertible: true,
              frame: sensor,
              group: gyro,
            }
          - {
              name: gyro.z,
              role: head,
              space: imu_angular_velocity,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: rad/s,
              metric_convertible: true,
              frame: sensor,
              group: gyro,
            }
      accel:
        channels:
          - {
              name: accel.x,
              role: head,
              space: imu_linear_acceleration,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: m/s^2,
              metric_convertible: true,
              frame: sensor,
              group: accel,
            }
          - {
              name: accel.y,
              role: head,
              space: imu_linear_acceleration,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: m/s^2,
              metric_convertible: true,
              frame: sensor,
              group: accel,
            }
          - {
              name: accel.z,
              role: head,
              space: imu_linear_acceleration,
              origin: measured,
              is_delta: false,
              is_physical: true,
              unit: m/s^2,
              metric_convertible: true,
              frame: sensor,
              group: accel,
            }
