# Source registry. Committed — no absolute local paths, no credentials.
# Anything machine-specific belongs in config/sources.local.yaml (gitignored).
#
# `max_episodes` caps are data-driven, from the M0 spike measurements recorded in
# docs/adr/000-source-selection.md. frames/episode below are measured, not guessed.

version: 1

defaults:
  with_video: false # see design §1: video metadata only by default
  max_episodes: 50

sources:
  # A — 2D planar pushing, absolute task-space xy in PIXELS. Not an arm.
  - source_id: pusht
    kind: lerobot
    uri: hf://datasets/lerobot/pusht
    revision: main
    embodiment: pusht_planar
    license: apache-2.0
    max_episodes: 80 # measured 124.5 frames/episode @10 Hz -> ~10.0k frames
    notes: >-
      LeRobot codebase_version v3.0: all episodes share one parquet file and one mp4;
      episode boundaries come from meta/episodes. Channel names motor_0/motor_1 are
      misleading and are overridden by config/embodiments.yaml.

  # B — ALOHA bimanual, absolute joint angles (rad) + 2 grippers. Same format as A.
  - source_id: aloha_sim_insertion
    kind: lerobot
    uri: hf://datasets/lerobot/aloha_sim_insertion_human
    revision: main
    embodiment: aloha_bimanual
    license: mit
    max_episodes: 50 # measured exactly 500 frames/episode @50 Hz -> 25.0k frames
    notes: >-
      Every episode is exactly 500 frames (10 s), so termination is a step limit,
      and there is no success or reward column at all.

  # C — OXE / RLDS. End-effector delta pose + gripper command + terminate flag.
  - source_id: berkeley_ur5
    kind: rlds
    uri: https://storage.googleapis.com/gresearch/robotics/berkeley_autolab_ur5/0.1.0
    revision: "0.1.0"
    split: train
    shard_layout_revision: "train:412-shards@0.1.0"
    embodiment: ur5_single_arm
    license: cc-by-4.0
    # Measured ~71 steps/episode, but also ~55 MB of inlined camera frames per episode, and
    # raw/ is kept verbatim. 12 episodes is ~660 MB staged from ~5 shards; 80 would be ~4.4 GB.
    max_episodes: 12
    reader: tfrecord_direct # docs/adr/001-rlds-reader-no-tensorflow.md: no TensorFlow
    # RLDS carries no timestamp field at all, so the time axis is ours. 5 Hz is the control
    # frequency published on the Berkeley UR5 dataset page cited in dataset_info.json; the
    # adapter refuses to run without this value rather than inventing one (ADR 009).
    control_hz: 5
    drop_channels:
      # 512-D per-step derivative, recomputable from the text; see design §A.C.6
      - steps/observation/natural_language_embedding
    notes: >-
      No stable upstream episode id. Identity is the episode's index within the split, which
      survives a re-shard; the shard file and the offset inside it are locators only. The
      declared shard_layout_revision is the staleness lever: changing it re-normalizes the
      corpus (and re-verifies content_hash) instead of duplicating it.

  # D — EPIC-KITCHENS-100, taken by layer. Action is an episode-level symbolic label.
  #
  # Three layers, three different servers, three different publication schedules. Each is
  # fetched independently and a 404 degrades exactly that layer's capabilities: a missing
  # camera pose is not an ingestion failure, it is `has_camera_pose: false`. That is why the
  # capabilities of two episodes of THIS SOURCE differ (ADR 011).
  - source_id: epic100
    kind: epic_kitchens
    # The annotation layer. Ends at the revision, because the fetcher appends the relative
    # path — `EPIC_100_train.csv`, `EPIC_100_video_info.csv`.
    uri: https://raw.githubusercontent.com/epic-kitchens/epic-kitchens-100-annotations/master
    revision: master
    embodiment: human_ego
    license: cc-by-nc-4.0 # non-commercial; propagates to export lines
    max_episodes: 60 # action segments, ~3 s each -> ~9k frames @50 fps
    layers: [annotations, camera_pose, imu]
    # Layer 2: EPIC-Fields COLMAP reconstructions, `<video_id>.json`. The upstream release is
    # a multi-GB archive; this URI serves the single published example, so most videos 404
    # here — which is the point. Point it at a full mirror in sources.local.yaml to get more.
    camera_pose_uri: https://raw.githubusercontent.com/epic-kitchens/epic-fields-code/main/example_data
    # Layer 3: GoPro metadata, `<participant>/meta_data/<video_id>-{gyro,accl}.csv`. Only
    # exists for the EPIC-100 extension videos; every EPIC-55 era video 404s.
    imu_uri: https://data.bris.ac.uk/datasets/2g1n6qdydwa9u22shpxqzp0t8m
    # No nominal IMU rate is declared here on purpose: it is ~195 Hz on P01_101 and ~198 Hz on
    # P01_103, so the stream carries the timestamps upstream shipped and nothing derives a rate.
    # Frame indices are derived from seconds at the EXTRACTION fps, which is NOT the video's
    # official fps: 50 fps videos were extracted at 50, everything else at a flat 60.
    # Measured against all 67,217 train segments (100% reproduced). See ADR 004.
    # We store the OFFICIAL-fps numbering instead, because that is the clock EPIC-Fields
    # indexes its poses on; the extraction numbering is preserved verbatim in raw_extra and
    # the two are never mixed. See ADR 010.
    frame_extraction_fps:
      when_official_fps_is_50: 50
      otherwise: 60
    videos: # deliberately three different layer combinations, verified by probe (ADR 011)
      - P01_01 # EPIC-55 era, official 59.94 fps: no GoPro metadata, no reconstruction
      - P01_103 # extension, official 50 fps: IMU only
      - P28_101 # extension, official 50 fps: IMU *and* the published EPIC-Fields example
    notes: >-
      Seconds are authoritative, frame indices are derived. Episodes are listed round-robin
      across `videos`, so even a small --max-episodes spans videos with and without each
      layer. The local 30 fps transcode is a mirror, registered in
      config/sources.local.yaml, never an authoritative source.
