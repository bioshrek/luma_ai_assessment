[project]
name = "rdp"
version = "0.0.0"
description = "Robot Demonstration Pipeline: multi-source ingestion, QC, and curated export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
rdp = "rdp.interfaces.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
# M0 feasibility spike only. Heavyweight and throwaway; never a runtime dependency.
spike = [
    "huggingface-hub>=0.24",
    "pandas>=2.2",
    "requests>=2.32",
    "tensorflow>=2.16,<2.20",
    "tensorflow-datasets>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdp"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/rdp"]

# pyarrow ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

# The dependency rule, enforced rather than documented. An unchecked layering convention decays
# within a week.
[tool.importlinter]
root_package = "rdp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward"
type = "layers"
layers = ["rdp.interfaces", "rdp.infrastructure", "rdp.application", "rdp.domain"]

[[tool.importlinter.contracts]]
name = "domain does no IO"
type = "forbidden"
source_modules = ["rdp.domain"]
forbidden_modules = [
    "sqlite3",
    "pyarrow",
    "urllib",
    "typer",
    "yaml",
    "rich",
    "tensorflow",
    "h5py",
]

[[tool.importlinter.contracts]]
name = "application depends on ports, not adapters"
type = "forbidden"
source_modules = ["rdp.application"]
forbidden_modules = ["rdp.infrastructure", "rdp.interfaces", "sqlite3", "pyarrow", "yaml"]
